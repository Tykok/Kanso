name: kanso

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-kanso}
      POSTGRES_USER: ${POSTGRES_USER:-kanso}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-kanso}
    ports:
      # Exposed so you can psql / point a local API run at it.
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - kanso-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-kanso} -d ${POSTGRES_DB:-kanso}"]
      interval: 5s
      timeout: 5s
      retries: 20

  api:
    build:
      context: ./apps/api
      args:
        # The same commit the web bundle is stamped with, so the two halves are
        # comparable: `springBoot { buildInfo() }` writes it into
        # build-info.properties and /api/me reports it. Unset, both report `dev`.
        KANSO_COMMIT: ${KANSO_COMMIT:-dev}
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://db:5432/${POSTGRES_DB:-kanso}
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER:-kanso}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD:-kanso}
      KANSO_WEB_ORIGIN: ${KANSO_WEB_ORIGIN:-http://localhost:3000}
      KANSO_AUTH_MODE: ${KANSO_AUTH_MODE:-oidc}
      KANSO_SECRET_KEY: ${KANSO_SECRET_KEY:-}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
      GITHUB_CLIENT_ID: ${GITHUB_CLIENT_ID:-}
      GITHUB_CLIENT_SECRET: ${GITHUB_CLIENT_SECRET:-}
      # Requests one API token may make per minute. Counted in the api container's
      # own heap, so this is a limit per replica and not per instance: run two and a
      # token gets twice the quota. `ApiTokenRateLimit` is where that assumption is
      # written down and where a shared counter would have to replace it.
      #
      # The default is spelled out here rather than left empty, for `NOTION_BASE_URL`'s
      # reason one field along — an empty value overrides `application.yml`'s own
      # default with the empty string. It bites harder on this one: the property binds
      # to an `Int`, so an empty string is not a blank setting but a conversion failure:
      # the container refuses to start with `Failed to bind properties under
      # 'kanso.api-tokens.per-minute' to int`, which is at least loud. The cost
      # is the number appearing twice; that is the trade `NOTION_API_VERSION` already
      # makes two lines below.
      KANSO_API_TOKEN_RATE_LIMIT: ${KANSO_API_TOKEN_RATE_LIMIT:-120}
      # 32 base64 bytes, encrypting `webhook_subscriptions.secret_cipher`. Empty means
      # outbound webhooks are off and creating one is refused — `WebhookSecret` argues why
      # that is better than a default nobody chose. `openssl rand -base64 32`.
      #
      # Left empty here rather than given a value, unlike KANSO_API_TOKEN_RATE_LIMIT two
      # fields up: that one had to be spelled out because an empty string fails to bind to
      # an `Int`, and this one binds to a `String` where empty is a meaningful setting —
      # the off switch.
      KANSO_WEBHOOK_SIGNING_KEY: ${KANSO_WEBHOOK_SIGNING_KEY:-}
      # Deliveries one subscription may receive per minute. Per replica, for
      # KANSO_API_TOKEN_RATE_LIMIT's reason, and spelled out for the same binding reason.
      KANSO_WEBHOOK_RATE_LIMIT: ${KANSO_WEBHOOK_RATE_LIMIT:-120}
      NOTION_TOKEN: ${NOTION_TOKEN:-}
      NOTION_CLIENT_ID: ${NOTION_CLIENT_ID:-}
      NOTION_CLIENT_SECRET: ${NOTION_CLIENT_SECRET:-}
      NOTION_PARENT_PAGE_ID: ${NOTION_PARENT_PAGE_ID:-}
      NOTION_API_VERSION: ${NOTION_API_VERSION:-2025-09-03}
      # Where Notion is. Overridden by one thing only: `e2e/import.spec.ts`, which
      # stands up a workspace of its own at `e2e/notion-workspace.ts` and points the
      # container at it, so the import can be walked in a browser against the real
      # `HttpNotionClient` rather than against a fake bound inside the application.
      # The default has to be spelled out rather than left empty — an empty value
      # would override `application.yml`'s own default with the empty string.
      NOTION_BASE_URL: ${NOTION_BASE_URL:-https://api.notion.com/v1}
    # So a `NOTION_BASE_URL` naming `host.docker.internal` reaches the machine running
    # the suite on Linux too, where Docker Desktop's own alias does not exist.
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "${API_PORT:-8080}:8080"
    volumes:
      # Holds the generated encryption key. Lose this volume without having set
      # KANSO_SECRET_KEY and the stored Notion and Google secrets have to be
      # entered again.
      - kanso-data:/app/data
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8080/actuator/health | grep -q UP"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 40s

  web:
    build:
      context: ./apps/web
      args:
        # Next.js inlines NEXT_PUBLIC_* at build time, so the API origin is a
        # build arg. The browser talks to the API directly (CORS + cookie).
        NEXT_PUBLIC_API_URL: http://localhost:${API_PORT:-8080}
        NEXT_PUBLIC_KANSO_COMMIT: ${KANSO_COMMIT:-dev}
    restart: unless-stopped
    depends_on:
      - api
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:${API_PORT:-8080}
    ports:
      - "${WEB_PORT:-3000}:3000"

volumes:
  kanso-pgdata:
  kanso-data:
