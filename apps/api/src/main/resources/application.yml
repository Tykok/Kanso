spring:
  application:
    name: kanso-api

  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/kanso}
    username: ${SPRING_DATASOURCE_USERNAME:kanso}
    password: ${SPRING_DATASOURCE_PASSWORD:kanso}
    hikari:
      pool-name: kanso-pool
      maximum-pool-size: 10

  flyway:
    enabled: true
    locations: classpath:db/migration

  jackson:
    # Jackson 3 already writes java.time values as ISO-8601, so there is nothing
    # to turn off here — WRITE_DATES_AS_TIMESTAMPS is gone from SerializationFeature.
    default-property-inclusion: non_null

  # One thread per recurring task, or they serialise: the inbound poller, the
  # stuck-job sweeper, the trash sweep, the outbound heartbeat, and one outbound clock
  # per sync destination (see OutboundWorker.start). A task that finds no free thread
  # waits for one, which is the exact coupling those per-destination clocks exist to
  # remove — so this is sized for the second destination before there is one, and keeps
  # a spare.
  #
  # The heartbeat is the one that must never queue behind anything. Its whole job is to
  # prove this process is alive while a drain sits blocked on a remote call, so a
  # heartbeat starved of a thread by the very drains it is covering would let the sweep
  # reclaim pushes that are still in flight — the replay OutboundWorker.beat exists to
  # prevent. Ten missed beats are needed before that happens, so the spare is what makes
  # the margin real rather than nominal.
  task:
    scheduling:
      pool:
        size: 7

server:
  port: 8080
  shutdown: graceful
  # The distribution image terminates TLS in Caddy and forwards to this process over the
  # loopback in plain http, so every request Boot sees claims to be `http://127.0.0.1:8080`
  # and the browser's real scheme and host survive only in the `X-Forwarded-Proto` and
  # `X-Forwarded-Host` Caddy sets without being asked. `framework` registers Boot's
  # `ForwardedHeaderFilter` at `Ordered.HIGHEST_PRECEDENCE`, so the request is wrapped ahead
  # of the whole chain — `OrderedRequestContextFilter` at -105 included, which is what makes
  # `ServletUriComponentsBuilder.fromCurrentContextPath()` correct too. The default is NONE,
  # which drops them.
  #
  # Two things break without it, and the quieter one is worse. `ConsentController.returnUrl`
  # and `ReturnUrlSuccessHandler.originOf` both derive this instance's origin from the
  # request in hand, so unwrapped they *agree* — both say `http`, no comparison fails, and a
  # member mid-flow is redirected off an `https` page to `http://…/oauth/consent`. The loud
  # one is `oauth2Login` deriving `redirect_uri` the same way, which Google refuses outright.
  # `ForwardedHeadersTest` pins the first; only a real provider would show the second.
  #
  # Honouring a client-supplied header is only safe because nothing but the proxy can reach
  # the JVM: the image binds it to 127.0.0.1 and exposes Caddy alone. Publishing this port
  # would let any caller claim any origin it liked — which is the same trust boundary
  # `PublicController` and `RegistrationRateLimit` note for `X-Forwarded-For`.
  forward-headers-strategy: framework
  servlet:
    session:
      cookie:
        # Stated rather than inherited. Connecting Notion ends with *Notion* navigating
        # the browser to /api/setup/notion/callback, and that request has to carry this
        # cookie or the callback cannot know who it is answering. A missing attribute
        # already behaves as Lax in current browsers, which is why the flow works
        # without this line — and Strict would break it silently, on a setting nobody
        # would think to connect to a Notion button. Lax is the weakest value that
        # allows a top-level GET, which is all the callback is.
        same-site: lax

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      probes:
        enabled: true

logging:
  level:
    dev.kanso: INFO

kanso:
  # Origin allowed to call the API with credentials, and where OAuth2 login
  # returns the browser after a successful round trip.
  web-origin: ${KANSO_WEB_ORIGIN:http://localhost:3000}

  security:
    # Encrypts the secrets the setup wizard collects. Base64 of 32 bytes.
    # Left empty, a key is generated into key-file on first boot — which must live
    # on a volume that survives the container, or the stored Notion and Google
    # secrets become unreadable on the next deploy.
    secret-key: ${KANSO_SECRET_KEY:}
    key-file: ${KANSO_KEY_FILE:./data/secret.key}

  auth:
    # oidc | dev. "dev" trusts an X-Kanso-User header and is for local work and
    # tests only — it is never entered by accident. With mode=oidc and no provider
    # configured, first launch shows the setup wizard, where you create an owner
    # account with an email and a password.
    mode: ${KANSO_AUTH_MODE:oidc}
    google:
      client-id: ${GOOGLE_CLIENT_ID:}
      client-secret: ${GOOGLE_CLIENT_SECRET:}
    github:
      client-id: ${GITHUB_CLIENT_ID:}
      client-secret: ${GITHUB_CLIENT_SECRET:}

  # The GitHub *App*, which is not kanso.auth.github above. That one signs people in and
  # reads GITHUB_CLIENT_ID; this one is installed on repositories, asks each member for
  # their own consent, and reads KANSO_GITHUB_CLIENT_ID. The names differ by a prefix and
  # the values differ entirely — pinning one and expecting the other presents as "GitHub
  # says the client id is wrong" with two correct client ids in the process.
  #
  # Both halves of the pair or neither: see KansoProperties.Github.appConfigured.
  github:
    client-id: ${KANSO_GITHUB_CLIENT_ID:}
    client-secret: ${KANSO_GITHUB_CLIENT_SECRET:}
    webhook-secret: ${KANSO_GITHUB_WEBHOOK_SECRET:}

  # Bearer tokens a member creates for a CLI, an SDK or a webhook signer. There is no
  # enable flag: the door is the feature, and an instance that did not want it would
  # simply have no rows in api_tokens.
  api-tokens:
    # Per token, per minute, counted in this process's heap — so with more than one
    # replica the effective limit is this times the number of them. See
    # ApiTokenRateLimit, which is where that assumption is written down and where the
    # move to a shared counter would have to happen.
    per-minute: ${KANSO_API_TOKEN_RATE_LIMIT:120}

  webhooks:
    # The key `webhook_subscriptions.secret_cipher` is encrypted under: 32 bytes, base64.
    # **Empty means outbound webhooks are off** — creating a subscription is refused rather
    # than served by storing a signing secret in plaintext. `WebhookSecret` argues why
    # refusing is the only honest option and what encryption here does and does not buy.
    #
    # No default value, unlike every other key in this file, and that is the decision: a
    # default compiled into the repository is not a key, it is a published one, and the
    # column's whole purpose is that a database dump is not a set of signing keys.
    # Generate one with `openssl rand -base64 32`.
    signing-key: ${KANSO_WEBHOOK_SIGNING_KEY:}
    # Deliveries one subscription may receive per minute, counted in this process's heap —
    # so the same per-replica caveat as `api-tokens.per-minute`, and deliberately the same
    # number: a webhook and the API callback it provokes are two halves of one
    # integration's traffic. `WebhookRateLimit` records both.
    per-minute: ${KANSO_WEBHOOK_RATE_LIMIT:120}
    # Much shorter than Notion's twenty seconds. A receiver's whole job is to accept a body
    # and return; one slower than this is going to be retried anyway, and the number bounds
    # how long one drain pass can be held by a black-holing endpoint.
    request-timeout: 5s

  notion:
    # Empty token => the no-op client. Sync jobs are still queued and completed,
    # so the queue is exercised without any network call.
    token: ${NOTION_TOKEN:}
    parent-page-id: ${NOTION_PARENT_PAGE_ID:}
    # The public integration, so a fresh database offers the Connect button instead of
    # asking for these two again. Not a token: nothing is connected until somebody consents.
    app:
      client-id: ${NOTION_CLIENT_ID:}
      client-secret: ${NOTION_CLIENT_SECRET:}
    api-version: ${NOTION_API_VERSION:2025-09-03}
    base-url: ${NOTION_BASE_URL:https://api.notion.com/v1}
    request-timeout: 20s

  sync:
    outbound:
      enabled: true
      poll-interval-ms: 500
      batch-size: 10
      # Per-destination overrides of `batch-size`, keyed on `Destination.wire`. Webhooks
      # get more than Notion's ten because a webhook job fans out to every matching
      # subscription and because the ceiling that actually binds is `webhooks.per-minute`,
      # which defers rather than fails. `KansoProperties.Outbound.batchSizes` carries the
      # arithmetic, including the worst-case pass length and why it is survivable.
      batch-sizes:
        webhook: 20
      max-attempts: 8
      # Notion allows roughly 3 requests/second averaged; stay under it.
      requests-per-second: 2.5
      # How long a 'running' job may go without its holder saying it is alive before
      # the job is assumed orphaned and returned to the queue. Not "how long a push
      # may take": a slow push keeps beating and keeps its lock for as long as it
      # needs — see V29. The worker beats at a tenth of this, so ten consecutive
      # missed beats are what it takes to declare a worker dead.
      stuck-job-timeout: 5m
    inbound:
      enabled: true
      interval-ms: 30000
      page-size: 50
      # Re-scan window on each poll, to absorb clock skew between Notion and us.
      overlap: 60s

  # Screen 26 prints "emptied after 30 days", so something has to do the emptying.
  # Hourly, because the unit on screen is a whole day: an entry can sit an hour past
  # its expiry without anybody being able to tell.
  trash:
    sweep:
      enabled: true
      interval-ms: 3600000

  realtime:
    channel: kanso_events
