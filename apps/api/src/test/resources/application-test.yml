# Tests drive the sync engine explicitly; the schedulers would otherwise claim
# jobs from under a test's feet and make assertions about the queue racy.
kanso:
  auth:
    mode: dev
  sync:
    outbound:
      enabled: false
    inbound:
      enabled: false
  # A fixed key, so the webhook slice is *on* in tests: without one, creating a
  # subscription is refused rather than storing a signing secret in plaintext, and every
  # test of the delivery path would be testing the refusal. Thirty-two bytes, and the
  # value is deliberately boring — it encrypts nothing but a per-test random secret in a
  # container that is thrown away.
  webhooks:
    signing-key: AAECAwQFBgcICQoLDA0ODxAREhMUFRYXGBkaGxwdHh8=
  # The GitHub App's HMAC key, pinned for the same reason the signing key above is: the
  # inbound half verifies every delivery against it, and without one `GithubWebhookTest`
  # would be testing the refusal rather than the fan-out. Environment-first is also the
  # only configuration path this secret has today — nothing writes
  # `instance_settings.github_webhook_secret_enc` until the manifest flow of plan three
  # lands, which `KansoProperties.Github.webhookSecret` already says in words.
  #
  # Deliberately not a plausible secret: it is compared, never spent, and the tests sign
  # their fixtures with this same value read back off `KansoProperties` so the two cannot
  # drift.
  github:
    webhook-secret: a-test-webhook-secret-and-nothing-more
    # `GithubDeliverySweeper` off for the reason the trash sweep below is off, which `V36`
    # asks for by name: a scheduler pruning `github_deliveries` mid-test would delete the
    # very row a redelivery assertion depends on colliding with.
    deliveries:
      sweep:
        enabled: false

  # Same reason, one screen along: a sweep firing mid-test would empty a countdown a
  # test is asserting about. `TrashServiceTest` calls `TrashService.empty` itself.
  trash:
    sweep:
      enabled: false

logging:
  level:
    dev.kanso: INFO
    org.testcontainers: WARN
    com.github.dockerjava: WARN
