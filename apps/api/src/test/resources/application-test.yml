# Tests drive the sync engine explicitly; the schedulers would otherwise claim
# jobs from under a test's feet and make assertions about the queue racy.
kanso:
  auth:
    mode: dev
  sync:
    outbound:
      enabled: false
    inbound:
      enabled: false
  # Same reason, one screen along: a sweep firing mid-test would empty a countdown a
  # test is asserting about. `TrashServiceTest` calls `TrashService.empty` itself.
  trash:
    sweep:
      enabled: false

logging:
  level:
    dev.kanso: INFO
    org.testcontainers: WARN
    com.github.dockerjava: WARN
